<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4fd8">
<title>Teacher Attendance</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f27;--mute:#667085;--line:#e4e7ec;--brand:#1f4fd8;
        --ok:#157f3d;--okbg:#e6f6ec;--warn:#9a6700;--warnbg:#fff4d6;--bad:#b42318;--badbg:#fde8e6;--neutralbg:#eef0f4}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c24;--ink:#e8eaf0;--mute:#9aa3b2;--line:#2a303c;
        --ok:#5ad08a;--okbg:#10301e;--warn:#f0c04a;--warnbg:#3a2f0d;--bad:#ff8a80;--badbg:#3b1512;--neutralbg:#232834}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header h1{font-size:17px;margin:0}
  main{max-width:760px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--brand);color:#fff;cursor:pointer;font-weight:600}
  button.secondary{background:var(--neutralbg);color:var(--ink)}
  button.danger{background:var(--bad);color:#fff}
  button.ok{background:var(--ok);color:#fff}
  button:disabled{opacity:.5;cursor:not-allowed}
  .big{width:100%;padding:18px;font-size:18px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row>*{flex:1}
  .tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
  .tabs button{background:var(--neutralbg);color:var(--ink);white-space:nowrap;flex:1}
  .tabs button.active{background:var(--brand);color:#fff}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase}
  .scroll{overflow-x:auto}
  a{color:var(--brand)}
  .tabs button{padding:10px 6px;font-size:14px}
  .nw{white-space:nowrap}
  .lv{padding:12px 0;border-bottom:1px solid var(--line)}
  .lv:last-child{border-bottom:0}
  .lvhead{display:flex;justify-content:space-between;gap:10px}
  .lvact{display:flex;gap:8px;margin-top:8px}
  .lvact button{padding:8px 14px}
  @media (max-width:480px){table{font-size:13px}th,td{padding:8px 3px}th{font-size:11px}}
  .pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--neutralbg)}
  .pill.present,.pill.approved{background:var(--okbg);color:var(--ok)}
  .pill.late,.pill.pending{background:var(--warnbg);color:var(--warn)}
  .pill.absent,.pill.rejected{background:var(--badbg);color:var(--bad)}
  .msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
  .msg.err{background:var(--badbg);color:var(--bad)}
  .msg.good{background:var(--okbg);color:var(--ok)}
  .mute{color:var(--mute);font-size:14px}
  .hidden{display:none!important}
  .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px}
</style>
</head>
<body>
<header>
  <h1 id="title">Teacher Attendance</h1>
  <div class="row" style="flex:0 0 auto"><span id="who" class="mute"></span><button id="logout" class="secondary hidden" style="flex:0 0 auto">Sign out</button></div>
</header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
