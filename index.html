<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176b58">
<title>Teacher Attendance</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bg:#f4f5f1;--paper:#fff;--ink:#202b27;--mute:#738079;--line:#e1e7e1;--brand:#176b58;--brand-dark:#105343;--soft:#eaf2ee;--ok:#15734e;--okbg:#e5f3eb;--warn:#966116;--warnbg:#fbf1db;--bad:#b44338;--badbg:#f9e9e6;--neutralbg:#eef1ed}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(ellipse at 8% 0%,#e7eee8 0,transparent 33rem),var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px max(22px,calc((100vw - 1120px)/2));background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
  header h1{font:800 17px/1.2 "Manrope",sans-serif;letter-spacing:0}
  header .row{align-items:center}
  main{max-width:1120px;margin:0 auto;padding:34px 24px 64px}
  #app{min-height:60vh}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:16px;box-shadow:0 4px 16px rgba(26,47,38,.035)}
  .page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:4px 0 26px}
  .page-heading h2{font:700 28px/1.2 "Manrope",sans-serif;color:var(--ink);text-transform:none;margin:0}
  .eyebrow{color:var(--brand);font-size:11px;font-weight:700;letter-spacing:1px;margin:0 0 7px}
  .page-heading .mute{margin:6px 0 0}
  .site-control{width:min(260px,100%);margin:0;color:var(--mute)}
  .site-control select{margin-top:5px;background-color:var(--paper)}
  .site-note{color:var(--mute);font-size:13px}
  h3{font:700 19px/1.3 "Manrope",sans-serif;margin:0 0 16px}
  h4{font-size:14px;margin:0}
  label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
  input,select,textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid #d5ddd7;border-radius:6px;background:#fff;color:var(--ink);font:inherit;accent-color:var(--brand)}
  input:focus,select:focus,textarea:focus{outline:3px solid rgba(23,107,88,.14);border-color:var(--brand)}
  input[type=checkbox]{width:17px;height:17px;margin:0}
  button{font:600 14px "DM Sans",sans-serif;border:0;border-radius:6px;padding:10px 15px;background:var(--brand);color:#fff;cursor:pointer;transition:background .16s,transform .16s}
  button:hover{background:var(--brand-dark)}button:active{transform:translateY(1px)}
  button.secondary{background:var(--neutralbg);color:var(--ink)}button.secondary:hover{background:#e2e8e2}
  button.danger{background:var(--bad);color:#fff}button.ok{background:var(--ok);color:#fff}
  button:disabled{opacity:.5;cursor:not-allowed}
  .big{width:100%;padding:15px;font-size:16px;margin-top:8px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:0}
  .tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:5px;margin-bottom:18px;padding:5px;background:#e8ede8;border-radius:8px;overflow:visible}
  .tabs button{background:transparent;color:var(--mute);white-space:normal;flex:none;min-width:0;padding:10px 8px}
  .tabs button.active{background:var(--paper);color:var(--brand);box-shadow:0 1px 4px #253b3018}
  .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--mute);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  tr:last-child td{border-bottom:0}
  .scroll{overflow-x:auto}.nw{white-space:nowrap}a{color:var(--brand)}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--neutralbg);white-space:nowrap}
  .pill.present,.pill.approved,.pill.complete,.pill.closed_by_admin{background:var(--okbg);color:var(--ok)}.pill.late,.pill.pending,.pill.scheduled,.pill.open,.pill.open_late{background:var(--warnbg);color:var(--warn)}.pill.absent,.pill.rejected,.pill.out_of_range{background:var(--badbg);color:var(--bad)}.pill.on_leave{background:var(--neutralbg);color:var(--ink)}
  .msg{padding:11px 13px;border-radius:6px;margin:12px 0;font-size:14px}.msg.err{background:var(--badbg);color:var(--bad)}.msg.good{background:var(--okbg);color:var(--ok)}
  .mute{color:var(--mute);font-size:14px}.hidden{display:none!important}
  .attendance-card{max-width:740px;padding:26px}.attendance-top,.section-heading,.assignment-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .attendance-top h3{font-size:23px;margin:0}.attendance-top .mute{margin:4px 0 0}
  .time-grid{display:grid;grid-template-columns:1fr 1fr;margin:26px 0 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .time-grid>div{padding:17px 0;display:grid;gap:4px}.time-grid>div+div{border-left:1px solid var(--line);padding-left:20px}.time-grid strong{font:700 20px "Manrope",sans-serif}
  .two-column{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.two-column .card{margin:0}
  .weekday-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.weekday-list label,.active-field label,.teacher-option{display:flex;align-items:center;gap:8px;margin:0}
  .weekday-list label{padding:8px 11px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
  .active-field{display:flex;align-items:flex-end;padding-bottom:10px}.assignment-heading{margin-top:22px}
  .teacher-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:10px}
  .teacher-option{padding:10px;border:1px solid var(--line);border-radius:6px;color:var(--ink);font-size:14px}.teacher-option small{margin-left:auto;color:var(--mute)}
  .lv{padding:14px 0;border-bottom:1px solid var(--line)}.lv:last-child{border-bottom:0}.lvhead{display:flex;justify-content:space-between;gap:10px}.lvact{display:flex;gap:8px;margin-top:8px}.lvact button{padding:8px 14px}
  .session-list{display:grid;gap:10px}.session-card{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 18px;background:var(--paper);border:1px solid var(--line);border-radius:8px}.session-info{min-width:0}.session-info .eyebrow{margin-bottom:4px}.session-info h4{font:700 16px/1.35 "Manrope",sans-serif;color:var(--ink)}.session-info p{margin:5px 0 0}.session-times{font-size:13px;color:var(--ink)}.session-times span{margin-left:14px}.session-action{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;min-width:145px}.session-action .msg{flex-basis:100%;margin:0}.schedule-layout{align-items:start}.schedule-layout .card{min-width:0}.schedule-layout .row{align-items:flex-end}.schedule-layout .session-card{align-items:flex-start;padding:12px}.schedule-layout .session-action{min-width:0}
  @media(max-width:680px){.session-card{align-items:flex-start;flex-direction:column}.session-action{justify-content:flex-start;width:100%}.schedule-layout .session-card{flex-direction:column}}
  @media(max-width:680px){main{padding:24px 16px 48px}.page-heading{align-items:stretch;flex-direction:column;gap:16px}.site-control{width:100%}.two-column{grid-template-columns:1fr}.attendance-card{padding:20px}}
  @media(max-width:680px){main .card,main .two-column,main .schedule-layout,main .row,main .row>div,main .row label,main .card label{min-width:0;max-width:100%}main .row{display:grid;grid-template-columns:minmax(0,1fr);align-items:stretch;gap:8px}main .row>*,main .row>div,main .row label,main .card label{width:100%;min-width:0;max-width:100%}main .card input[type="date"],main .card input[type="time"],main .card input[type="month"]{display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%}}
  @media(max-width:480px){header{padding:12px 15px}header #who{display:none}main{padding:20px 12px 40px}.card{padding:17px}.page-heading h2{font-size:24px}.tabs{width:100%}.tabs button{padding:10px 13px;font-size:13px}.row{gap:8px}.time-grid strong{font-size:18px}table{font-size:13px}th,td{padding:9px 7px}th{font-size:10px}}
</style>
</head>
<body>
<header>
  <h1 id="title">Teacher Attendance</h1>
  <div class="row" style="flex:0 0 auto"><span id="who" class="mute"></span><button id="logout" class="secondary hidden" style="flex:0 0 auto">Sign out</button></div>
</header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const appScript = document.createElement("script");
  appScript.type = "module";
  appScript.src = `app.js?v=${encodeURIComponent(window.APP_CONFIG.ASSET_VERSION)}`;
  document.body.appendChild(appScript);
</script>
</body>
</html>
